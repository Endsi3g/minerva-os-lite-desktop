name: Apply Supabase migrations

# Corrige la cause racine de l'audit v11 → v12 (Phase 0) : les migrations
# n'étaient jamais appliquées de façon fiable, provoquant une dérive de
# schéma en production. Ce workflow applique automatiquement tout nouveau
# fichier dans supabase/migrations/ dès qu'il est poussé sur master.
on:
  push:
    branches: [master]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push migrations
        run: supabase db push --linked --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
