name: Sync Gmail replies (every 2h)

# Alternative gratuite au cron natif de Vercel : le plan Hobby limite les
# cron jobs Vercel à 1x/jour maximum. GitHub Actions n'a pas cette limite et
# est gratuit pour ce volume d'exécutions — ce workflow appelle le même
# endpoint que le cron Vercel, toutes les 2 heures.
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call gmail-check-replies endpoint
        run: |
          curl -sf -X GET "https://minerva-os-lite-desktop.vercel.app/api/cron/gmail-check-replies" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
