name: Deploy Mobile Apps (iOS & Android)

# Déclenchement automatique sur tag désactivé temporairement : le pipeline
# échoue de toute façon avant d'atteindre Fastlane — le dossier natif
# android/ n'est pas commité dans le repo (`cap add android` jamais exécuté/
# commité) et aucun Gemfile n'existe nulle part pour Bundler/Fastlane. Tant
# que ces deux prérequis ne sont pas fournis, ce workflow ne peut pas
# aboutir. Se déclenche uniquement manuellement (Actions → Run workflow)
# en attendant — n'affecte pas le déploiement web (Vercel), déjà fonctionnel.
on:
  workflow_dispatch:

jobs:
  deploy-android:
    name: Build & Deploy Android (Google Play)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Build + sync en une seule étape via le script package.json dédié : il
      # dissimule temporairement app/api avant next build (obligatoire pour
      # output:'export', les routes API ne peuvent pas être exportées
      # statiquement) puis le restaure — contrairement à un `next build` +
      # `cap sync` séparés, qui laissait app/api en place et faisait échouer
      # le build sur la première route API rencontrée (ex. /api/ads/attribution).
      - name: Build Next.js Static Site & Sync Android Platform
        run: pnpm run cap:sync:android

      - name: Setup Ruby (Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Fastlane
        run: gem install fastlane bundler

      - name: Run Fastlane Android Beta
        run: bundle exec fastlane android beta
        env:
          PLAY_STORE_JSON_KEY_PATH: ${{ secrets.PLAY_STORE_JSON_KEY_PATH }}

  deploy-ios:
    name: Build & Deploy iOS (TestFlight)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      # Voir commentaire équivalent dans le job Android — build + sync doivent
      # rester une seule étape pour que la dissimulation temporaire de app/api
      # (obligatoire pour output:'export') soit bien restaurée avant la suite.
      - name: Build Next.js Static Site & Sync iOS Platform
        run: pnpm run cap:sync:ios

      - name: Setup Ruby (Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Fastlane & CocoaPods
        run: gem install fastlane cocoapods bundler

      - name: Run Fastlane iOS Beta
        run: bundle exec fastlane ios beta
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
