name: AI provider health check (every 6h)

# Alternative gratuite au cron natif de Vercel : le plan Hobby limite les
# cron jobs Vercel à 1x/jour maximum. GitHub Actions n'a pas cette limite et
# est gratuit pour ce volume d'exécutions — ce workflow appelle le même
# endpoint que le cron Vercel (déjà présent, 1x/jour), toutes les 6 heures.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  ai-health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Call ai-health-check endpoint
        run: |
          curl -sf -X GET "https://minerva-os-lite-desktop.vercel.app/api/cron/ai-health-check" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
